<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog filmova</title>
  <meta name="description" content="Popis filmova">
  <meta property="og:title" content="Katalog">
  <meta property="og:description" content="Popis filmova">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="stil.css">
</head>
<body>

<a href="#main" class="skip-link">Preskoči sadržaj</a>

<header>
  <nav>
    <h1>FilmKatalog</h1>

    <button type="button" id="menu-toggle" class="hamburger" aria-label="Izbornik" aria-expanded="false" aria-controls="main-menu">&#9776;</button>

    <ul id="main-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="katalog.html" class="active" aria-current="page">Katalog</a></li>
      <li><a href="about.html">O nama</a></li>
      <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
  </nav>
</header>

<main id="main" tabindex="-1">
  <p id="storageMessage" role="status"></p>
  <section aria-labelledby="favoritesHeading">
    <h2 id="favoritesHeading">Moji favoriti (<span id="favoritesCount">0</span>)</h2>
    <p id="favoritesMessage" role="status">Učitavanje favorita...</p>
    <div class="grid" id="favoritesGrid"></div>
  </section>

  <section aria-labelledby="filmsHeading">
  <h2 id="filmsHeading">Svi filmovi</h2>

  <div class="controls">
    <div class="control-field">
    <label for="searchInput">Pretraži filmove</label>
    <input type="text" id="searchInput" placeholder="Pretraži filmove...">
    </div>
    <div class="control-field">
    <label for="genreFilter">Žanr</label>
    <select id="genreFilter">
      <option value="Svi">Svi žanrovi</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Action">Action</option>
      <option value="Drama">Drama</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Animation">Animation</option>
    </select>
    </div>
  </div>

  <p id="statusMessage" role="status">Učitavanje filmova...</p>

  <div class="grid" id="filmGrid"></div>
  </section>
</main>

<script type="module" src="main.js"></script>

<footer>
  <p>© 2026 FilmKatalog</p>
</footer>

<script type="module" src="navigacija.js"></script>
</body>
</html>
